<div 
      class="fixed bottom-4 right-4 bg-background border border-border rounded-lg shadow-lg p-4 max-w-sm z-50 animate-in slide-in-from-bottom-5">
      <div *ngFor="let toast of toasts">
      <div class="flex flex-col gap-1 text-primary">
        <h3 class="font-semibold text-sm">{{ toast.title }}</h3>
        <p class="text-sm text-muted-foreground" [ngClass]="toast.type">{{ toast.message }}</p>
      </div>
      </div>
    </div>
