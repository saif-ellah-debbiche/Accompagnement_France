 <div 
      *ngIf="isOpen"
      class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm animate-in fade-in"
      (click)="onCancel()">
      
      <!-- Dialog -->
      <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div 
          class="bg-card border border-border/50 rounded-lg shadow-lg w-full max-w-lg animate-in zoom-in-95"
          (click)="$event.stopPropagation()">
          
          <!-- Header -->
          <div class="flex items-start justify-between p-6 pb-4">
            <div class="flex items-start gap-4 flex-1">
              <!-- Alert Icon -->
              <div class="flex h-10 w-10 items-center justify-center rounded-full bg-amber-500/10 shrink-0">
                <lucide-icon [img]="AlertTriangle" [size]="20" class="text-amber-500"></lucide-icon>
              </div>
              
              <!-- Title & Description -->
              <div class="flex-1 space-y-1">
                <h2 class="text-lg font-semibold text-foreground">
                  {{ title || defaultTitle }}
                </h2>
                <p class="text-sm text-muted-foreground leading-relaxed">
                  {{ description || defaultDescription }}
                </p>
              </div>
            </div>
            
            <!-- Close Button -->
            <button
              type="button"
              (click)="onCancel()"
              class="rounded-md p-1 hover:bg-accent transition-colors">
              <lucide-icon [img]="X" [size]="16" class="text-muted-foreground"></lucide-icon>
            </button>
          </div>

          <!-- Warning Message (Optional) -->
          <div *ngIf="showWarning" class="mx-6 mb-4 rounded-md border border-amber-500/20 bg-amber-500/10 p-3">
            <p class="text-xs text-amber-600 dark:text-amber-500 font-medium">
              ⚠️ Cette action {{ isDestructive ? 'est irréversible' : 'nécessite votre confirmation' }}.
            </p>
          </div>

          <!-- Additional Content Slot -->
          <div *ngIf="showContent" class="px-6 pb-4">
            <ng-content></ng-content>
          </div>

          <!-- Footer Actions -->
          <div class="flex items-center justify-end gap-3 border-t border-border/50 p-6 pt-4 bg-muted/20">
            <button
              type="button"
              (click)="onCancel()"
              [disabled]="isLoading"
              class="px-4 py-2 text-sm font-medium rounded-md border border-input bg-background hover:bg-accent text-foreground hover:text-accent-foreground transition-colors disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
              {{ cancelText }}
            </button>
            
            <button
              type="button"
              (click)="onConfirm()"
              [disabled]="isLoading"
              [class]="getConfirmButtonClass()">
              <span *ngIf="isLoading" class="inline-block h-4 w-4 border-2 border-current border-t-transparent rounded-full animate-spin mr-2"></span>
              {{ isLoading ? loadingText : confirmText }}
            </button>
          </div>
        </div>
      </div>
    </div>
