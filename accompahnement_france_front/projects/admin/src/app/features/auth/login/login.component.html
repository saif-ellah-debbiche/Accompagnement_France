<div class="min-h-screen flex items-center justify-center p-4 !bg-background">
      <div class="w-full max-w-md">
        <!-- Logo/Brand -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4">
            <lucide-icon [img]="LogIn" [size]="32" class="text-primary"></lucide-icon>
          </div>
          <h1 class="text-3xl font-bold text-foreground">AccompagneFrance</h1>
          <p class="text-muted-foreground mt-2">Connectez-vous à votre espace administrateur</p>
        </div>

        <!-- Login Card -->
        <div class="bg-card border border-border/50 rounded-2xl shadow-xl p-8">
          <form (ngSubmit)="handleLogin()">
            <!-- Email Field -->
            <div class="space-y-2 mb-4">
              <label for="email" class="text-sm font-medium text-foreground">Email</label>
              <div class="relative">
                <lucide-icon 
                  [img]="Mail" 
                  [size]="18" 
                  class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">
                </lucide-icon>
                <input
                  type="email"
                  id="email"
                  [(ngModel)]="email"
                  name="email"
                  placeholder="admin@accompagnefrance.fr"
                  class="w-full pl-15  pr-4 py-3 bg-background border border-input rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 text-foreground"
                  required
                />
              </div>
            </div>

            <!-- Password Field -->
            <div class="space-y-2 mb-6">
              <label for="password" class="text-sm font-medium text-foreground">Mot de passe</label>
              <div class="relative">
                <lucide-icon 
                  [img]="Lock" 
                  [size]="18" 
                  class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">
                </lucide-icon>
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  id="password"
                  [(ngModel)]="password"
                  name="password"
                  placeholder="••••••••"
                  class="w-full pl-15 pr-12 py-3 bg-background border border-input rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 text-foreground "
                  required
                />
                <button
                  type="button"
                  (click)="togglePassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors">
                  <lucide-icon [img]="showPassword ? EyeOff : Eye" [size]="18"></lucide-icon>
                </button>
              </div>
            </div>

            <!-- Remember Me & Forgot Password -->
             <div class="flex items-center justify-between mb-6">
              <label class="flex items-center gap-2 cursor-pointer">
                <input
                  type="checkbox"
                  [(ngModel)]="rememberMe"
                  name="rememberMe"
                  class="w-4 h-4 rounded border-input text-primary focus:ring-2 focus:ring-ring focus:ring-offset-2"
                />
                <span class="text-sm text-muted-foreground">Se souvenir de moi</span>
              </label>
              <a 
                routerLink="/auth/forget-password"
                class="text-sm text-primary hover:underline">
                Mot de passe oublié ?
              </a>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              [disabled]="isLoading"
              class="w-full bg-primary text-primary-foreground py-3 rounded-lg font-medium hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
              <span *ngIf="isLoading" class="inline-block h-4 w-4 border-2 border-current border-t-transparent rounded-full animate-spin"></span>
              {{ isLoading ? 'Connexion...' : 'Se connecter' }}
            </button>
          </form>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="mt-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg">
            <p class="text-sm text-red-500">{{ errorMessage }}</p>
          </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-sm text-muted-foreground mt-6">
          © 2024 AccompagneFrance. Tous droits réservés.
        </p>
      </div>
    </div>
