<div class="min-h-screen flex items-center justify-center p-4 !bg-background">
      <div class="w-full max-w-md">
        <!-- Back Button -->
        <a 
          routerLink="/login"
          class="inline-flex items-center gap-2 text-sm text-muted-foreground hover:text-foreground mb-8 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          Retour à la connexion
        </a>

        <!-- Card -->
        <div class="bg-card border border-border/50 rounded-2xl shadow-xl p-8">
          <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-primary/10 rounded-full mb-4">
              <lucide-icon [img]="Mail" [size]="28" class="text-primary"></lucide-icon>
            </div>
            <h1 class="text-2xl font-bold text-foreground">Mot de passe oublié ?</h1>
            <p class="text-muted-foreground mt-2 text-sm">
              Entrez votre adresse email et nous vous enverrons un lien pour réinitialiser votre mot de passe.
            </p>
          </div>

          <form (ngSubmit)="handleSubmit()" *ngIf="!emailSent">
            <!-- Email Field -->
            <div class="space-y-2 mb-6">
              <label for="email" class="text-sm font-medium text-foreground">Email</label>
              <div class="relative">
                <lucide-icon 
                  [img]="Mail" 
                  [size]="18" 
                  class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">
                </lucide-icon>
                <input
                  type="email"
                  id="email"
                  [(ngModel)]="email"
                  name="email"
                  placeholder="admin@accompagnefrance.fr"
                  class="w-full pl-12 pr-4 py-3 bg-background border border-input rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 text-foreground"
                  required
                />
              </div>
              <p *ngIf="errorMessage" class="text-red">{{errorMessage}}</p>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              [disabled]="isLoading"
              class="w-full bg-primary text-primary-foreground py-3 rounded-lg font-medium hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
              <span *ngIf="isLoading" class="inline-block h-4 w-4 border-2 border-current border-t-transparent rounded-full animate-spin"></span>
              {{ isLoading ? 'Envoi...' : 'Envoyer le lien' }}
            </button>
          </form>

          <!-- Success Message -->
          <div *ngIf="emailSent" class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/10 rounded-full mb-4">
              <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-foreground mb-2">Email envoyé !</h3>
            <p class="text-sm text-muted-foreground mb-6">
              Nous avons envoyé un lien de réinitialisation à <strong>{{ email }}</strong>. Vérifiez votre boîte de réception.
            </p>
            <button
              (click)="emailSent = false"
              class="text-sm text-primary hover:underline">
              Renvoyer l'email
            </button>
          </div>
        </div>
      </div>
    </div>
