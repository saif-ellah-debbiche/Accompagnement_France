<div class="w-full max-w-2xl mx-auto">
      <div class="bg-card border border-border/50 rounded-lg shadow-sm mt-6">
        <!-- Header -->
        <div class="border-b border-border/50 p-6">
          <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary/10">
              <lucide-icon [img]="Lock" [size]="20" class="text-primary"></lucide-icon>
            </div>
            <div>
              <h2 class="text-lg font-semibold text-foreground">Changer le mot de passe</h2>
              <p class="text-sm text-muted-foreground">Mettez à jour votre mot de passe pour sécuriser votre compte</p>
            </div>
          </div>
        </div>

        <!-- Form -->
        <form (ngSubmit)="handleSubmit()" class="p-6">
          <div class="space-y-6">
            <!-- Current Password -->
            <div class="space-y-2">
              <label for="currentPassword" class="text-sm font-medium text-foreground">
                Mot de passe actuel
              </label>
              <div class="relative">
                <lucide-icon 
                  [img]="Lock" 
                  [size]="18" 
                  class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">
                </lucide-icon>
                <input
                  [type]="showCurrentPassword ? 'text' : 'password'"
                  id="currentPassword"
                  [(ngModel)]="currentPassword"
                  name="currentPassword"
                  placeholder="Entrez votre mot de passe actuel"
                  class="w-full pl-10 pr-12 py-3 bg-background border border-input rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
                  required
                />
                <button
                  type="button"
                  (click)="toggleCurrentPassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors">
                  <lucide-icon [img]="showCurrentPassword ? EyeOff : Eye" [size]="18"></lucide-icon>
                </button>
              </div>
            </div>

            <div class="border-t border-border/50"></div>

            <!-- New Password -->
            <div class="space-y-2">
              <label for="newPassword" class="text-sm font-medium text-foreground">
                Nouveau mot de passe
              </label>
              <div class="relative">
                <lucide-icon 
                  [img]="Lock" 
                  [size]="18" 
                  class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">
                </lucide-icon>
                <input
                  [type]="showNewPassword ? 'text' : 'password'"
                  id="newPassword"
                  [(ngModel)]="newPassword"
                  name="newPassword"
                  placeholder="Entrez votre nouveau mot de passe"
                  class="w-full pl-10 pr-12 py-3 bg-background border border-input rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
                  required
                />
                <button
                  type="button"
                  (click)="toggleNewPassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors">
                  <lucide-icon [img]="showNewPassword ? EyeOff : Eye" [size]="18"></lucide-icon>
                </button>
              </div>
            </div>

            <!-- Confirm New Password -->
            <div class="space-y-2">
              <label for="confirmPassword" class="text-sm font-medium text-foreground">
                Confirmer le nouveau mot de passe
              </label>
              <div class="relative">
                <lucide-icon 
                  [img]="Lock" 
                  [size]="18" 
                  class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">
                </lucide-icon>
                <input
                  [type]="showConfirmPassword ? 'text' : 'password'"
                  id="confirmPassword"
                  [(ngModel)]="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirmez votre nouveau mot de passe"
                  class="w-full pl-10 pr-12 py-3 bg-background border border-input rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2"
                  required
                />
                <button
                  type="button"
                  (click)="toggleConfirmPassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground transition-colors">
                  <lucide-icon [img]="showConfirmPassword ? EyeOff : Eye" [size]="18"></lucide-icon>
                </button>
              </div>
            </div>

            <!-- Password Requirements -->
            <div class="bg-muted/30 border border-border/50 rounded-lg p-4">
              <p class="text-xs font-medium text-foreground mb-3">Exigences du mot de passe :</p>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <div class="flex items-center gap-2">
                  <div [class]="newPassword.length >= 8 ? 'text-emerald-500' : 'text-muted-foreground'">
                    <svg *ngIf="newPassword.length >= 8" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <svg *ngIf="newPassword.length < 8" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="10"/>
                    </svg>
                  </div>
                  <span class="text-xs" [class]="newPassword.length >= 8 ? 'text-emerald-500' : 'text-muted-foreground'">
                    8 caractères minimum
                  </span>
                </div>
                <div class="flex items-center gap-2">
                  <div [class]="hasUpperCase ? 'text-emerald-500' : 'text-muted-foreground'">
                    <svg *ngIf="hasUpperCase" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <svg *ngIf="!hasUpperCase" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="10"/>
                    </svg>
                  </div>
                  <span class="text-xs" [class]="hasUpperCase ? 'text-emerald-500' : 'text-muted-foreground'">
                    Une majuscule
                  </span>
                </div>
                <div class="flex items-center gap-2">
                  <div [class]="hasLowerCase ? 'text-emerald-500' : 'text-muted-foreground'">
                    <svg *ngIf="hasLowerCase" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <svg *ngIf="!hasLowerCase" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="10"/>
                    </svg>
                  </div>
                  <span class="text-xs" [class]="hasLowerCase ? 'text-emerald-500' : 'text-muted-foreground'">
                    Une minuscule
                  </span>
                </div>
                <div class="flex items-center gap-2">
                  <div [class]="hasNumber ? 'text-emerald-500' : 'text-muted-foreground'">
                    <svg *ngIf="hasNumber" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <svg *ngIf="!hasNumber" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="10"/>
                    </svg>
                  </div>
                  <span class="text-xs" [class]="hasNumber ? 'text-emerald-500' : 'text-muted-foreground'">
                    Un chiffre
                  </span>
                </div>
                <div class="flex items-center gap-2">
                  <div [class]="hasSpecialChar ? 'text-emerald-500' : 'text-muted-foreground'">
                    <svg *ngIf="hasSpecialChar" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <svg *ngIf="!hasSpecialChar" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="10"/>
                    </svg>
                  </div>
                  <span class="text-xs" [class]="hasSpecialChar ? 'text-emerald-500' : 'text-muted-foreground'">
                   un caractère spécial
                  </span>
                </div>
              </div>
            </div>

            <!-- Error Message -->
            <div *ngIf="errorMessage" class="p-3 bg-red-500/10 border border-red-500/20 rounded-lg">
              <p class="text-sm text-red-500">{{ errorMessage }}</p>
            </div>

            <!-- Success Message -->
            <div *ngIf="successMessage" class="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-lg">
              <p class="text-sm text-emerald-500">{{ successMessage }}</p>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex items-center justify-end gap-3 mt-6 pt-6 border-t border-border/50">
            <button
              *ngIf="!mustChangePassword"
              type="button"
              (click)="handleBack()"
              [disabled]="isLoading"
              class="px-4 py-2 text-sm font-medium rounded-md border border-input bg-background hover:bg-accent hover:text-accent-foreground transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
              <lucide-icon [name]="arrowLeft" class="w-5 h-5 mr-2" /> Retour à l'accueil
            </button>
            <button
              type="submit"
              [disabled]="isLoading || !isPasswordValid"
              class="px-4 py-2 bg-primary text-primary-foreground rounded-md text-sm font-medium hover:bg-primary/90 transition-colors disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center gap-2">
              <span *ngIf="isLoading" class="inline-block h-4 w-4 border-2 border-current border-t-transparent rounded-full animate-spin"></span>
              {{ isLoading ? 'Modification...' : 'Mettre à jour le mot de passe' }}
            </button>
          </div>
        </form>
      </div>
    </div>
