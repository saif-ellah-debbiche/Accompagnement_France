<aside
  [class]="'flex flex-col h-screen bg-background border-r border-border/50 fixed left-0 top-0 transition-all duration-300 text-foreground ' + (isCollapsed ? 'w-16' : 'w-64')"
  [attr.data-collapsed]="isCollapsed">

  <!-- Header -->
  <div class="border-b border-border/50 py-4">
    <div class="flex items-center gap-3 px-2">
  <div
    class="flex aspect-square size-12 items-center justify-center rounded-lg shrink-0">
    <img src="/assets/logo.png" alt="Cabinet de conseil France Intégration" width="48" height="48"
      class="w-full h-full object-contain p-1" />
  </div>
  <div class="grid flex-1 text-left text-sm leading-tight" *ngIf="!isCollapsed">
    <span class="truncate font-semibold">Cabinet de conseil</span>
    <span class="truncate text-xs text-muted-foreground">France Intégration</span>
  </div>
  <button class="p-2 hover:bg-accent rounded-md transition-colors ml-auto" (click)="toggleSidebar()"
  [title]="isCollapsed ? 'Expand' : 'Collapse'">
  <lucide-icon [img]="Menu" [size]="16" class="text-muted-foreground"></lucide-icon>
</button>
</div>
  </div>

  <!-- Content -->
  <div class="flex-1 overflow-y-auto py-4">
    <div class="px-2">
      <div class="px-3 py-2 text-xs font-semibold text-muted-foreground uppercase tracking-wider" *ngIf="!isCollapsed">
        Navigation
      </div>
      <nav class="flex flex-col gap-1">
        <a *ngFor="let item of navItems" [routerLink]="item.href" routerLinkActive="bg-accent text-accent-foreground"
          [routerLinkActiveOptions]="{exact: true}"
          [class]="'flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors hover:bg-accent hover:text-accent-foreground ' + (isCollapsed ? 'justify-center' : '')"
          [title]="isCollapsed ? item.name : ''">
          <lucide-icon [img]="item.icon" [size]="16" class="shrink-0"></lucide-icon>
          <span *ngIf="!isCollapsed">{{ item.name }}</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- Footer -->
  <div class="border-t border-border/50 p-2" (click)="logout()">
    <a [class]="'flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors hover:bg-accent hover:text-accent-foreground cursor-pointer ' + (isCollapsed ? 'justify-center' : '')"
      [title]="isCollapsed ? 'Déconnexion' : ''">
      <lucide-icon [img]="LogOut" [size]="16" class="shrink-0"></lucide-icon>
      <span *ngIf="!isCollapsed">Déconnexion</span>
    </a>
  </div>
</aside>
