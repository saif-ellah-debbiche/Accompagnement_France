  <app-card specialstyles="p-8 space-y-4 hover:shadow-lg transition-all bg-card border-border">
      <div class="w-14 h-14 rounded-lg bg-accent/20 flex items-center justify-center">
        <!-- Lucide Icon -->
        <lucide-icon 
          *ngIf="service.icon" 
          [name]="service.icon"
          [size]="28" 
          class="text-accent-foreground">
        </lucide-icon>
        
        <!-- Custom Image Icon -->
        <img 
          *ngIf="!service.icon && service.iconUrl"
          [src]="service.iconUrl"
          [alt]="service.label"
          class="w-7 h-7 object-contain"
        />
      </div>
      
      <div class="space-y-3">
        <h2 class="text-2xl font-semibold text-card-foreground">{{ service.label }}</h2>
        <p class="text-muted-foreground leading-relaxed">{{ service.description }}</p>
      </div>
    </app-card>
